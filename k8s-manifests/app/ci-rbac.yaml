# Limited identity for CI: may only update Deployments in the "app" namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: app
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: app
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
---
# Long-lived token for the ServiceAccount (the token value is generated by the cluster)
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: app
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
